<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexTrade | Advanced Bot Automation</title>
    <style>
        :root {
            --bg-dark: #10141c;
            --card-bg: #1a1f2c;
            --input-bg: #242b3d;
            --primary-red: #ff444f;
            --primary-green: #00b15e;
            --text-main: #ffffff;
            --text-muted: #98a1b6;
            --border-color: #2e374a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #090b0f;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background-color: var(--bg-dark);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            min-height: 720px;
        }

        /* Top Header */
        .app-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.15rem;
        }

        .logo-dot {
            width: 10px;
            height: 10px;
            background-color: var(--primary-red);
            border-radius: 50%;
        }

        .account-toggle {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 3px;
            border: 1px solid var(--border-color);
        }

        .toggle-btn {
            padding: 5px 14px;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            color: var(--text-muted);
            background: transparent;
        }

        .toggle-btn.active {
            background-color: var(--primary-red);
            color: var(--text-main);
        }

        /* Views management */
        .view {
            display: none;
            flex: 1;
            flex-direction: column;
            padding: 20px;
        }

        .view.active {
            display: flex;
        }

        /* Home View Styles */
        .balance-card {
            text-align: center;
            padding: 30px 0;
        }

        .balance-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .balance-amount {
            font-size: 2.4rem;
            font-weight: 700;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .btn-deposit { background-color: var(--primary-red); color: white; }
        .btn-withdraw { background-color: var(--card-bg); color: white; border: 1px solid var(--border-color); }

        .btn-trade-start {
            background: linear-gradient(135deg, var(--primary-red), #d62c37);
            color: white;
            padding: 16px;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 68, 79, 0.3);
            margin-top: auto;
        }

        /* Market / Bot Selection Panel */
        .section-title {
            font-size: 0.95rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .selector-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .bot-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .bot-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .bot-card.active {
            border-color: var(--primary-red);
            background-color: rgba(255, 68, 79, 0.08);
            color: var(--text-main);
        }

        /* Deriv Config Panel Styles */
        .config-group {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 20px;
        }

        .input-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-row label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 140px;
        }

        .input-wrapper input, .input-wrapper select {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            text-align: right;
            outline: none;
        }

        .input-wrapper select {
            text-align-last: right;
            padding-right: 24px;
            appearance: none;
        }

        /* Custom Payout/Prediction Section */
        .payout-info {
            background: rgba(0, 177, 94, 0.1);
            border: 1px dashed var(--primary-green);
            padding: 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .payout-rate { color: var(--primary-green); }

        .bot-actions {
            display: flex;
            gap: 12px;
            margin-top: auto;
        }

        .btn-back {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            flex: 0.4;
        }

        .btn-run {
            background-color: var(--primary-green);
            color: white;
            flex: 1;
            box-shadow: 0 4px 15px rgba(0, 177, 94, 0.3);
            font-weight: 700;
        }

        /* Persistent Navigation Header/Footer */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 14px 0;
            margin-top: auto;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 0.75rem;
            cursor: pointer;
        }

        .nav-item.active { color: var(--primary-red); }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <div class="logo-area">
                <div class="logo-dot"></div>
                <span>ApexTrade</span>
            </div>
            <div class="account-toggle">
                <button class="toggle-btn active" id="real-toggle" onclick="switchAccount('real')">Real</button>
                <button class="toggle-btn" id="demo-toggle" onclick="switchAccount('demo')">Demo</button>
            </div>
        </header>

        <div id="view-dashboard" class="view active">
            <div class="balance-card">
                <div class="balance-label" id="balance-label">Your real balance</div>
                <div class="balance-amount" id="balance-amount">$30.04</div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-deposit">Deposit</button>
                <button class="btn btn-withdraw">Withdraw</button>
            </div>

            <button class="btn-trade-start" onclick="changeView('view-trading')">Start real trading</button>
        </div>

        <div id="view-trading" class="view">
            <div class="section-title">Asset Market</div>
            <div class="selector-box">
                <span style="font-weight: 600;" id="market-asset">Volatility 100 (1s) Index</span>
                <span style="color: var(--text-muted); font-size: 0.85rem;">▼</span>
            </div>

            <div class="section-title">Trade Type Bot</div>
            <div class="bot-grid">
                <div class="bot-card active" onclick="selectBot('matches_differs', this)">Matches / Differs</div>
                <div class="bot-card" onclick="selectBot('even_odd', this)">Even / Odd</div>
                <div class="bot-card" onclick="selectBot('over_under', this)">Over / Under</div>
            </div>

            <div class="section-title">Configuration Parameters</div>
            <div class="config-group">
                <div class="input-row">
                    <label>Initial Stake</label>
                    <div class="input-wrapper">
                        <input type="number" id="param-stake" value="1.00" step="0.5" oninput="calculatePayout()">
                    </div>
                </div>
                
                <div class="input-row" id="prediction-row">
                    <label>Last Digit Prediction</label>
                    <div class="input-wrapper">
                        <select id="param-prediction" onchange="calculatePayout()">
                            <option value="0">0</option><option value="1">1</option><option value="2">2</option>
                            <option value="3">3</option><option value="4">4</option><option value="5" selected>5</option>
                            <option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option>
                        </select>
                    </div>
                </div>

                <div class="input-row">
                    <label>Martingale Multiplier</label>
                    <div class="input-wrapper">
                        <input type="number" id="param-martingale" value="2.1" step="0.1">
                    </div>
                </div>

                <div class="input-row">
                    <label>Max Loss Steps</label>
                    <div class="input-wrapper">
                        <input type="number" id="param-max-steps" value="5">
                    </div>
                </div>
            </div>

            <div class="payout-info">
                <span>Expected Return / Payout:</span>
                <span class="payout-rate" id="payout-calc">+$9.09 (909.1%)</span>
            </div>

            <div class="bot-actions">
                <button class="btn btn-back" onclick="changeView('view-dashboard')">Back</button>
                <button class="btn btn-run" onclick="toggleBotRun(this)">Run Bot Layout</button>
            </div>
        </div>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="changeView('view-dashboard')">
                <span>📊</span><span>Trading</span>
            </div>
            <div class="nav-item">
                <span>⚙️</span><span>Settings</span>
            </div>
        </nav>
    </div>

    <script>
        let currentBalance = 30.04;
        let isRunning = false;
        let activeBotType = 'matches_differs';

        function changeView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function switchAccount(type) {
            const realBtn = document.getElementById('real-toggle');
            const demoBtn = document.getElementById('demo-toggle');
            const label = document.getElementById('balance-label');
            const amount = document.getElementById('balance-amount');

            if(type === 'real') {
                realBtn.classList.add('active');
                demoBtn.classList.remove('active');
                label.innerText = "Your real balance";
                amount.innerText = "$30.04";
            } else {
                demoBtn.classList.add('active');
                realBtn.classList.remove('active');
                label.innerText = "Your demo balance";
                amount.innerText = "$11,249.76";
            }
        }

        function selectBot(botType, element) {
            activeBotType = botType;
            document.querySelectorAll('.bot-card').forEach(c => c.classList.remove('active'));
            element.classList.add('active');

            const predictionRow = document.getElementById('prediction-row');
            
            // Adjust form inputs based on selected strategy
            if (botType === 'even_odd') {
                predictionRow.style.display = 'none';
            } else {
                predictionRow.style.display = 'flex';
            }
            calculatePayout();
        }

        // Simulates realistic Deriv binary options risk premium scales
        function calculatePayout() {
            const stake = parseFloat(document.getElementById('param-stake').value) || 0;
            const pred = parseInt(document.getElementById('param-prediction').value);
            const display = document.getElementById('payout-calc');

            if(activeBotType === 'matches_differs') {
                // Matches return high rewards (~9x payout), Differs returned lower baseline (~10%)
                // Simulating a "Matches" selection return option for high premium display
                let profit = stake * 9.09;
                display.innerText = `+$${profit.toFixed(2)} (+909.1%)`;
            } else if (activeBotType === 'even_odd') {
                let profit = stake * 0.95;
                display.innerText = `+$${profit.toFixed(2)} (+95.0%)`;
            } else if (activeBotType === 'over_under') {
                // Return calculation moves dynamically relative to digit limits
                let scale = pred > 5 ? (10 - pred) * 0.25 : (pred + 1) * 0.22;
                let profit = stake * scale;
                display.innerText = `+$${profit.toFixed(2)} (+${(scale * 100).toFixed(1)}%)`;
            }
        }

        function toggleBotRun(btn) {
            isRunning = !isRunning;
            if(isRunning) {
                btn.innerText = "Stop Bot Setup";
                btn.style.backgroundColor = "var(--primary-red)";
                btn.style.boxShadow = "0 4px 15px rgba(255, 68, 79, 0.3)";
            } else {
                btn.innerText = "Run Bot Layout";
                btn.style.backgroundColor = "var(--primary-green)";
                btn.style.boxShadow = "0 4px 15px rgba(0, 177, 94, 0.3)";
            }
        }
        
        // Initial setup run
        calculatePayout();
    </script>
</body>
</html>
