<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Trading Dashboard</title>
    <style>
        :root {
            --bg-dark: #0b0e14;
            --card-bg: #161a22;
            --primary-red: #f23645;
            --primary-green: #089981;
            --text-main: #ffffff;
            --text-muted: #848e9c;
            --border-color: #2a2e39;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* Mobile App Container Window */
        .app-container {
            width: 100%;
            max-width: 410px;
            background-color: var(--bg-dark);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Header Area */
        .app-header {
            padding: 20px 20px 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }

        .logo-dot {
            width: 12px;
            height: 12px;
            background-color: var(--primary-red);
            border-radius: 50%;
        }

        /* Account Type Switcher */
        .account-toggle {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 4px;
            border: 1px solid var(--border-color);
        }

        .toggle-btn {
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            color: var(--text-muted);
            background: transparent;
            transition: all 0.2s ease;
        }

        .toggle-btn.active {
            background-color: var(--primary-red);
            color: var(--text-main);
        }

        /* Balance Section */
        .balance-card {
            padding: 20px;
            text-align: center;
        }

        .balance-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .balance-amount {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 20px;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 12px;
            padding: 0 20px;
            margin-bottom: 24px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-deposit {
            background-color: var(--primary-red);
            color: var(--text-main);
        }

        .btn-withdraw {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        /* Stats Row */
        .stats-grid {
            display: flex;
            justify-content: space-between;
            background-color: var(--card-bg);
            margin: 0 20px 24px 20px;
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .stat-item {
            text-align: center;
            flex: 1;
        }

        .stat-item:not(:last-child) {
            border-right: 1px solid var(--border-color);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1rem;
            font-weight: 600;
        }

        .stat-value.green { color: var(--primary-green); }

        /* Main Action Call */
        .cta-area {
            padding: 0 20px 30px 20px;
        }

        .btn-trade-start {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-red), #b3202c);
            color: var(--text-main);
            padding: 16px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(242, 54, 69, 0.3);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 12px 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 0.75rem;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-item.active {
            color: var(--primary-red);
        }

        .nav-icon {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <div class="logo-area">
                <div class="logo-dot"></div>
                <span>ApexTrade</span>
            </div>
            <div class="account-toggle">
                <button class="toggle-btn active" onclick="switchAccount('real')">Real</button>
                <button class="toggle-btn" onclick="switchAccount('demo')">Demo</button>
            </div>
        </header>

        <div class="balance-card">
            <div class="balance-label" id="balance-title">Your real balance</div>
            <div class="balance-amount" id="balance-display">$30.04</div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-deposit">Deposit</button>
            <button class="btn btn-withdraw">Withdraw</button>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-label">Profit today</div>
                <div class="stat-value green">+$0.00</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Trades</div>
                <div class="stat-value">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Winrate</div>
                <div class="stat-value">100%</div>
            </div>
        </div>

        <div class="cta-area">
            <button class="btn-trade-start" id="main-action-btn">Start real trading</button>
        </div>

        <nav class="bottom-nav">
            <a class="nav-item active">
                <span class="nav-icon">📊</span>
                <span>Trading</span>
            </a>
            <a class="nav-item">
                <span class="nav-icon">👥</span>
                <span>Community</span>
            </a>
            <a class="nav-item">
                <span class="nav-icon">👤</span>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <script>
        // Smooth switching handling logic for demo vs real accounts
        function switchAccount(type) {
            const buttons = document.querySelectorAll('.toggle-btn');
            const balanceTitle = document.getElementById('balance-title');
            const balanceDisplay = document.getElementById('balance-display');
            const mainBtn = document.getElementById('main-action-btn');

            buttons.forEach(btn => btn.classList.remove('active'));

            if (type === 'real') {
                buttons[0].classList.add('active');
                balanceTitle.innerText = "Your real balance";
                balanceDisplay.innerText = "$30.04";
                mainBtn.innerText = "Start real trading";
                mainBtn.style.background = "linear-gradient(135deg, var(--primary-red), #b3202c)";
                mainBtn.style.boxShadow = "0 4px 15px rgba(242, 54, 69, 0.3)";
            } else {
                buttons[1].classList.add('active');
                balanceTitle.innerText = "Your demo balance";
                balanceDisplay.innerText = "$11,249.76";
                mainBtn.innerText = "Start demo trading";
                mainBtn.style.background = "linear-gradient(135deg, var(--primary-green), #056656)";
                mainBtn.style.boxShadow = "0 4px 15px rgba(8, 153, 129, 0.3)";
            }
        }
    </script>
</body>
</html>
