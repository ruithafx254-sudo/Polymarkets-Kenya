<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Enterprise OS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
--bg-outer:#e3e6e8;
--bg-app:#f7f9fa;
--surface-white:#ffffff;
--primary-blue:#007aff;
--text-main:#111111;
--text-muted:#6e7781;
--border-color:#e1e4e8;
--success-green:#28a745;
--danger-red:#dc3545;
--shadow-sm:0 2px 8px rgba(0,0,0,0.04);
--shadow-lg:0 16px 40px rgba(0,0,0,0.08);
--shadow-blue:0 8px 24px rgba(0,122,255,0.25);
--radius-xl:32px;
--radius-lg:20px;
--radius-md:12px;
--transition:all .3s cubic-bezier(.25,.8,.25,1);
}

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

body{
background:var(--bg-outer);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.device-frame{
width:100%;
max-width:414px;
height:850px;
max-height:95vh;
background:var(--bg-app);
border-radius:var(--radius-xl);
box-shadow:var(--shadow-lg), inset 0 0 0 8px #fff;
display:flex;
flex-direction:column;
position:relative;
overflow:hidden;
}

.auth-screen{
position:absolute;
inset:0;
background:linear-gradient(135deg,#0b101e 0%,#1a2235 100%);
z-index:500;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:24px;
color:#fff;
transition:.4s;
}

.auth-screen.hidden{
opacity:0;
pointer-events:none;
transform:scale(1.05);
}

.auth-logo{
width:80px;
height:80px;
background:linear-gradient(135deg,#007aff,#00c6ff);
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
font-size:2.4rem;
font-weight:800;
margin-bottom:24px;
box-shadow:var(--shadow-blue);
}

.auth-title{
font-size:1.9rem;
font-weight:800;
margin-bottom:8px;
}

.auth-sub{
font-size:.9rem;
color:#97a3b7;
margin-bottom:30px;
}

.auth-card{
width:100%;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
padding:24px;
border-radius:24px;
backdrop-filter:blur(14px);
}

.auth-tabs{
display:flex;
gap:10px;
margin-bottom:20px;
}

.auth-tab{
flex:1;
padding:13px;
border:none;
border-radius:12px;
font-weight:700;
background:rgba(255,255,255,.08);
color:#fff;
cursor:pointer;
}

.auth-tab.active{
background:#007aff;
}

.auth-form{
display:flex;
flex-direction:column;
gap:15px;
}

.auth-input{
width:100%;
padding:16px;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.08);
border-radius:14px;
color:white;
outline:none;
font-size:1rem;
}

.auth-input::placeholder{
color:#93a0b5;
}

.btn-auth{
width:100%;
padding:16px;
border:none;
border-radius:14px;
background:#007aff;
color:white;
font-size:1rem;
font-weight:800;
cursor:pointer;
box-shadow:var(--shadow-blue);
}

.app-header{
background:rgba(255,255,255,.88);
backdrop-filter:blur(12px);
padding:24px 20px 16px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid var(--border-color);
}

.brand-title{
font-size:1.2rem;
font-weight:800;
display:flex;
align-items:center;
gap:8px;
}

.brand-logo{
width:24px;
height:24px;
background:#007aff;
color:#fff;
border-radius:6px;
display:flex;
align-items:center;
justify-content:center;
}

.account-selector{
padding:8px 12px;
border:none;
border-radius:20px;
background:#e8f0fe;
color:#007aff;
font-weight:700;
}

.view-container{
flex:1;
overflow-y:auto;
}

.view{
display:none;
padding:20px;
flex-direction:column;
gap:20px;
}

.view.active{
display:flex;
}

.equity-card,.ai-engine-box,.profile-list{
background:#fff;
border-radius:20px;
padding:22px;
box-shadow:var(--shadow-sm);
}

.equity-card{text-align:center;}

.equity-label{
font-size:.8rem;
color:var(--text-muted);
margin-bottom:10px;
}

.equity-amount{
font-size:3rem;
font-weight:800;
margin-bottom:15px;
}

.progress-container{
height:8px;
background:#e5e5e5;
border-radius:10px;
overflow:hidden;
margin-bottom:8px;
}

.progress-bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#007aff,#00c6ff);
}

.grid-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.action-btn{
padding:16px;
border:none;
border-radius:16px;
background:#fff;
font-weight:700;
box-shadow:var(--shadow-sm);
cursor:pointer;
}

.signal-screen{
background:#0b101e;
color:#fff;
padding:20px;
border-radius:16px;
text-align:center;
margin:20px 0;
}

.signal-asset{color:#007aff;font-size:.8rem;margin-bottom:10px;}
.signal-text{font-size:1.5rem;font-weight:800;margin-bottom:8px;}
.signal-sub{font-size:.8rem;color:#95a1b4;}

.parameters-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:20px;
}

.param-input{
background:#f5f7fa;
padding:12px;
border-radius:12px;
}

.param-input select,.param-input input{
width:100%;
border:none;
background:transparent;
font-weight:800;
outline:none;
}

.btn-master{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:#007aff;
color:#fff;
font-weight:800;
cursor:pointer;
}

.btn-master.active{
background:#dc3545;
}

.bottom-nav{
display:flex;
justify-content:space-around;
padding:16px 20px 24px;
background:rgba(255,255,255,.92);
border-top:1px solid var(--border-color);
}

.nav-item{
display:flex;
flex-direction:column;
align-items:center;
font-size:.75rem;
color:#6e7781;
cursor:pointer;
}

.nav-item.active{
color:#007aff;
}

.toast-container{
position:absolute;
top:80px;
left:50%;
transform:translateX(-50%);
width:90%;
z-index:1000;
}

.toast{
background:#111;
color:#fff;
padding:14px;
border-radius:12px;
margin-bottom:10px;
}
</style>
</head>
<body>

<div class="device-frame">

<div class="auth-screen" id="auth-screen">
<div class="auth-logo">A</div>
<div class="auth-title">Apex Enterprise</div>
<div class="auth-sub">Secure Neural Execution Environment</div>

<div class="auth-card">
<div class="auth-tabs">
<button class="auth-tab active" id="login-tab" onclick="switchAuthMode('login')">Sign In</button>
<button class="auth-tab" id="signup-tab" onclick="switchAuthMode('signup')">Create Account</button>
</div>

<div class="auth-form">
<input type="text" class="auth-input" placeholder="Full Name" id="signup-name" style="display:none;">
<input type="email" class="auth-input" placeholder="Email Address" id="login-email">
<input type="password" class="auth-input" placeholder="Password" id="login-pass">
<button class="btn-auth" id="auth-btn" onclick="handleLogin()">Secure Sign In</button>
</div>
</div>
</div>

<div class="toast-container" id="toast-area"></div>

<header class="app-header">
<div class="brand-title">
<div class="brand-logo">A</div>
ApexOS
</div>

<select class="account-selector" id="account-type" onchange="switchAccountType()">
<option value="real">Real Account</option>
<option value="demo">Demo Account</option>
</select>
</header>

<div class="view-container">
<div id="view-home" class="view active">

<div class="equity-card">
<div class="equity-label">Total Equity Balance</div>
<div class="equity-amount" id="display-balance">$50.00</div>
<div class="progress-container">
<div class="progress-bar" id="goal-progress"></div>
</div>
<div class="target-text">Goal Progress: $50,000 Target</div>
</div>

<div class="grid-buttons">
<button class="action-btn" onclick="openModal('deposit')">Deposit Funds</button>
<button class="action-btn" onclick="openModal('withdraw')">Withdraw</button>
</div>

<div class="ai-engine-box">
<div class="signal-screen">
<div class="signal-asset" id="sig-asset">READY TO SYNC...</div>
<div class="signal-text" id="sig-main">--</div>
<div class="signal-sub" id="sig-status">Awaiting trade parameters</div>
</div>

<div class="parameters-row">
<div class="param-input">
<select id="inp-market">
<option value="Matches/Differs">Matches/Differs</option>
<option value="Even/Odd">Even/Odd</option>
<option value="Over/Under">Over/Under</option>
</select>
</div>

<div class="param-input">
<input type="number" id="inp-stake" value="1" step="1">
</div>
</div>

<button class="btn-master" id="btn-toggle-bot" onclick="toggleBotEngine()">Execute AI Automation</button>
</div>
</div>

<div id="view-ledger" class="view">
<div id="ledger-list">No executions recorded yet.</div>
</div>

<div id="view-profile" class="view">
<div class="profile-list">
<div style="text-align:center;">
<h2 class="profile-name">Apex Trader</h2>
<div class="profile-email">Not Signed In</div>
<button class="btn-auth" style="margin-top:20px;" onclick="handleLogout()">Secure Logout</button>
</div>
</div>
</div>
</div>

<nav class="bottom-nav">
<div class="nav-item active" onclick="switchTab('view-home',this)">
<div>⎈</div>
<div>Engine</div>
</div>

<div class="nav-item" onclick="switchTab('view-ledger',this)">
<div>≡</div>
<div>Ledger</div>
</div>

<div class="nav-item" onclick="switchTab('view-profile',this)">
<div>👤</div>
<div>Profile</div>
</div>
</nav>
</div>

<script>
const SUPABASE_URL='https://hsovbnxatorocibfgrhc.supabase.co';
const SUPABASE_KEY='sb_publishable_G0-dlq60ymmGhCLj1xKsOg_3MNY9ArP';

const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let realBalance=50;
let demoBalance=10000;
let isRealAccount=true;
const targetBalance=50000;
let totalPnL=0;
let isEngineRunning=false;
let scanInterval;
let authMode='login';
let currentTargetIndex='';

const volatilityIndices=[
'Volatility 10 (1s) Index',
'Volatility 25 (1s) Index',
'Volatility 50 (1s) Index',
'Volatility 75 (1s) Index',
'Volatility 100 (1s) Index'
];

function switchAuthMode(mode){
authMode=mode;

const loginTab=document.getElementById('login-tab');
const signupTab=document.getElementById('signup-tab');
const signupName=document.getElementById('signup-name');
const authBtn=document.getElementById('auth-btn');

if(mode==='signup'){
loginTab.classList.remove('active');
signupTab.classList.add('active');
signupName.style.display='block';
authBtn.innerText='Create Secure Account';
authBtn.setAttribute('onclick','handleSignup()');
}else{
signupTab.classList.remove('active');
loginTab.classList.add('active');
signupName.style.display='none';
authBtn.innerText='Secure Sign In';
authBtn.setAttribute('onclick','handleLogin()');
}
}

function showToast(message){
const container=document.getElementById('toast-area');
const toast=document.createElement('div');
toast.className='toast';
toast.innerText=message;
container.appendChild(toast);
setTimeout(()=>toast.remove(),3000);
}

async function handleSignup(){
const name=document.getElementById('signup-name').value.trim();
const email=document.getElementById('login-email').value.trim();
const password=document.getElementById('login-pass').value.trim();

if(!name||!email||!password){
showToast('Complete all fields');
return;
}

const {data,error}=await supabaseClient.auth.signUp({
email,
password,
options:{
data:{full_name:name}
}
});

if(error){
showToast(error.message);
return;
}

showToast('Account created successfully');
document.querySelector('.profile-name').innerText=name;
document.querySelector('.profile-email').innerText=email;
document.getElementById('auth-screen').classList.add('hidden');
updateBalanceUI();
}

async function handleLogin(){
const email=document.getElementById('login-email').value.trim();
const password=document.getElementById('login-pass').value.trim();

const {data,error}=await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error){
showToast(error.message);
return;
}

const user=data.user;

document.querySelector('.profile-name').innerText=user.user_metadata?.full_name||'Apex Trader';
document.querySelector('.profile-email').innerText=user.email;

document.getElementById('auth-screen').classList.add('hidden');
showToast('Authentication Successful');
updateBalanceUI();
}

async function handleLogout(){
await supabaseClient.auth.signOut();
document.getElementById('auth-screen').classList.remove('hidden');
showToast('Logged out');
}

async function restoreSession(){
const {data:{session}}=await supabaseClient.auth.getSession();

if(session?.user){
document.querySelector('.profile-name').innerText=session.user.user_metadata?.full_name||'Apex Trader';
document.querySelector('.profile-email').innerText=session.user.email;
document.getElementById('auth-screen').classList.add('hidden');
updateBalanceUI();
}
}

restoreSession();

function switchAccountType(){
const selector=document.getElementById('account-type');
isRealAccount=(selector.value==='real');
updateBalanceUI();
}

function switchTab(viewId,element){
document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
document.querySelectorAll('.nav-item').forEach(v=>v.classList.remove('active'));
document.getElementById(viewId).classList.add('active');
element.classList.add('active');
}

function updateBalanceUI(){
let bal=isRealAccount?realBalance:demoBalance;
document.getElementById('display-balance').innerText=`$${bal.toFixed(2)}`;
let progress=(bal/targetBalance)*100;
document.getElementById('goal-progress').style.width=`${progress}%`;
}

function derivPayout(type,digit,stake){
if(type==='match') return stake*9;
if(type==='differ') return stake*1.1;
if(type==='evenodd') return stake*1.95;

const payouts={
0:9.0,
1:4.5,
2:3.0,
3:2.25,
4:1.8,
5:1.5,
6:1.28,
7:1.12,
8:1.05
};

return stake*payouts[digit];
}

function toggleBotEngine(){
const btn=document.getElementById('btn-toggle-bot');

if(isEngineRunning){
isEngineRunning=false;
btn.innerText='Execute AI Automation';
btn.classList.remove('active');
clearTimeout(scanInterval);
}else{
isEngineRunning=true;
btn.innerText='Halt System Process';
btn.classList.add('active');
runScannerCycle();
}
}

function runScannerCycle(){
if(!isEngineRunning) return;

const market=document.getElementById('inp-market').value;
const stake=parseFloat(document.getElementById('inp-stake').value)||1;

currentTargetIndex=volatilityIndices[Math.floor(Math.random()*volatilityIndices.length)];

let signalText='';
let signalSub='';
let profit=0;

const isWin=Math.random()<0.52;

document.getElementById('sig-asset').innerText=`SCANNING: ${currentTargetIndex}`;

if(market==='Matches/Differs'){
const digit=Math.floor(Math.random()*10);
const mode=Math.random()>0.5?'MATCH':'DIFFER';

signalText=`${mode} DIGIT ${digit}`;

if(mode==='MATCH'){
const payout=derivPayout('match',digit,stake);
signalSub=`Deriv Match Payout: ${payout.toFixed(2)} USD`;
profit=isWin?(payout-stake):-stake;
}else{
const payout=derivPayout('differ',digit,stake);
signalSub=`Deriv Differ Payout: ${payout.toFixed(2)} USD`;
profit=isWin?(payout-stake):-stake;
}
}
else if(market==='Even/Odd'){
const choice=Math.random()>0.5?'EVEN':'ODD';
const payout=derivPayout('evenodd',0,stake);

signalText=`PREDICT ${choice}`;
signalSub=`Deriv Even/Odd Payout: ${payout.toFixed(2)} USD`;
profit=isWin?(payout-stake):-stake;
}
else{
const digit=Math.floor(Math.random()*9);
const direction=Math.random()>0.5?'OVER':'UNDER';
const payout=derivPayout('overunder',digit,stake);

signalText=`${direction} ${digit}`;
signalSub=`Deriv ${direction} ${digit} Payout: ${payout.toFixed(2)} USD`;
profit=isWin?(payout-stake):-stake;
}

document.getElementById('sig-main').innerText=signalText;
document.getElementById('sig-status').innerText=signalSub;

scanInterval=setTimeout(()=>{
if(!isEngineRunning) return;

if(isRealAccount){
realBalance+=profit;
}else{
demoBalance+=profit;
}

updateBalanceUI();
logExecution(profit,market,signalText);
runScannerCycle();
},3000);
}

function logExecution(profit,market,signal){
const ledger=document.getElementById('ledger-list');

const row=document.createElement('div');
row.style.marginBottom='12px';
row.style.background='#fff';
row.style.padding='16px';
row.style.borderRadius='14px';

row.innerHTML=`
<div style="font-weight:700;">${currentTargetIndex}</div>
<div style="font-size:.8rem;color:#666;margin-top:6px;">${market} | ${signal}</div>
<div style="margin-top:8px;font-weight:800;color:${profit>=0?'green':'red'};">
${profit>=0?'+':''}$${profit.toFixed(2)}
</div>
`;

if(ledger.innerText.includes('No executions')) ledger.innerHTML='';
ledger.prepend(row);
}
</script>

</body>
</html>
