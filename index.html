<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Enterprise | Trading</title>
    <style>
        :root {
            /* Samsung One UI / Enterprise Light Theme */
            --bg-body: #f4f5f7;
            --bg-surface: #ffffff;
            --primary-blue: #007aff;
            --primary-blue-hover: #005bb5;
            --text-dark: #1d1d1f;
            --text-gray: #86868b;
            --border-light: #e5e5ea;
            --status-green: #34c759;
            --status-red: #ff3b30;
            --shadow-soft: 0 10px 40px rgba(0, 0, 0, 0.04);
            --shadow-btn: 0 4px 14px rgba(0, 122, 255, 0.3);
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e8eaed; /* Outer background to frame the app */
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .device-frame {
            width: 100%;
            max-width: 414px; /* Standard premium mobile width */
            background-color: var(--bg-body);
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 24px 80px rgba(0,0,0,0.15);
            border: 8px solid #ffffff;
            display: flex;
            flex-direction: column;
            height: 850px;
            position: relative;
        }

        /* Clean Enterprise Header */
        .header {
            background-color: var(--bg-surface);
            padding: 24px 24px 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-light);
            z-index: 10;
        }

        .brand {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--primary-blue), #00c6ff);
            border-radius: 8px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .account-badge {
            background-color: #f2f2f7;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-gray);
            cursor: pointer;
        }

        /* Scrollable Content Area */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Core Balance Card */
        .balance-card {
            background-color: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 28px 24px;
            box-shadow: var(--shadow-soft);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .balance-title {
            font-size: 0.9rem;
            color: var(--text-gray);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .balance-value {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .goal-tracker {
            display: inline-block;
            background-color: rgba(0, 122, 255, 0.1);
            color: var(--primary-blue);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        /* Primary Actions */
        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-secondary {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-light);
            padding: 16px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-dark);
            box-shadow: var(--shadow-soft);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary:active { transform: scale(0.98); background-color: #f2f2f7; }
        
        .m-pesa-text { color: #34c759; font-weight: 700; font-size: 0.75rem; display: block; margin-top: 4px; }

        /* The AI Engine Scanner Card */
        .ai-scanner-card {
            background: linear-gradient(180deg, #ffffff 0%, #f4f5f7 100%);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-light);
            position: relative;
        }

        .section-header {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
        }

        .ai-status {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--primary-blue);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary-blue);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 122, 255, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0, 122, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 122, 255, 0); }
        }

        .signal-display {
            background-color: #1d1d1f;
            border-radius: var(--radius-md);
            padding: 20px;
            color: white;
            text-align: center;
            margin-bottom: 16px;
        }

        .signal-target { font-size: 1rem; color: #86868b; margin-bottom: 4px; }
        .signal-action { font-size: 2.2rem; font-weight: 800; letter-spacing: 1px; margin-bottom: 8px; }
        .signal-action.even { color: #00c6ff; }
        .signal-action.odd { color: #ff9500; }
        
        .signal-timing {
            background: rgba(255,255,255,0.1);
            padding: 8px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Trading Parameters */
        .param-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .input-group {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-light);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
        }

        .input-label { font-size: 0.75rem; color: var(--text-gray); font-weight: 600; margin-bottom: 4px; display: block; }
        .input-field {
            width: 100%;
            border: none;
            outline: none;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
            background: transparent;
        }

        /* Execute Button */
        .btn-execute {
            background-color: var(--primary-blue);
            color: white;
            width: 100%;
            padding: 20px;
            border-radius: var(--radius-lg);
            border: none;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-execute:active { transform: scale(0.98); }
        .btn-execute.running { background-color: var(--status-red); box-shadow: 0 4px 14px rgba(255, 59, 48, 0.3); }

        /* Minimal Footer Nav */
        .bottom-nav {
            background-color: var(--bg-surface);
            padding: 16px 24px 24px 24px;
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-around;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: var(--text-gray);
            font-size: 0.75rem;
            font-weight: 600;
        }

        .nav-item.active { color: var(--primary-blue); }
        .nav-icon { font-size: 1.3rem; }

    </style>
</head>
<body>

    <div class="device-frame">
        
        <header class="header">
            <div class="brand">
                <div class="brand-icon">A</div>
                Apex OS
            </div>
            <div class="account-badge">Real Account</div>
        </header>

        <div class="content">
            
            <div class="balance-card">
                <div class="balance-title">Available Equity</div>
                <div class="balance-value" id="main-balance">$50.00</div>
                <div class="goal-tracker">Milestone Target: $50,000.00</div>
            </div>

            <div class="quick-actions">
                <button class="btn-secondary">
                    Deposit Funds
                    <span class="m-pesa-text">Payhero / M-Pesa Ready</span>
                </button>
                <button class="btn-secondary">
                    Withdraw
                    <span class="m-pesa-text" style="color:var(--text-gray)">Instant Payout</span>
                </button>
            </div>

            <div class="ai-scanner-card">
                <div class="section-header">
                    <span>Neural Signal Engine</span>
                    <div class="ai-status">
                        <div class="pulse-dot"></div>
                        Scanning Live
                    </div>
                </div>

                <div class="signal-display">
                    <div class="signal-target">Asset: Volatility 100 Index</div>
                    <div class="signal-action even" id="ai-prediction">PREPARING...</div>
                    <div class="signal-timing" id="ai-timing">Awaiting next tick cycle</div>
                </div>

                <div class="param-grid">
                    <div class="input-group">
                        <span class="input-label">Base Stake ($)</span>
                        <input type="number" class="input-field" value="2.00" step="0.5">
                    </div>
                    <div class="input-group">
                        <span class="input-label">Tight TP Limit ($)</span>
                        <input type="number" class="input-field" value="5.00" step="1">
                    </div>
                    <div class="input-group">
                        <span class="input-label">Martingale Split</span>
                        <input type="number" class="input-field" value="2.1" step="0.1">
                    </div>
                    <div class="input-group">
                        <span class="input-label">Max Steps</span>
                        <input type="number" class="input-field" value="4">
                    </div>
                </div>

                <button class="btn-execute" id="btn-run" onclick="toggleEngine()">Initialize Automated Bot</button>
            </div>

        </div>

        <nav class="bottom-nav">
            <div class="nav-item active">
                <span class="nav-icon">📊</span>
                <span>Workspace</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">⚙️</span>
                <span>Config</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">👤</span>
                <span>Profile</span>
            </div>
        </nav>

    </div>

    <script>
        let isRunning = false;
        let aiInterval;
        let countdownInterval;

        function simulateAISignal() {
            const predictionEl = document.getElementById('ai-prediction');
            const timingEl = document.getElementById('ai-timing');
            
            // Logic to simulate highly advanced analysis
            const isEven = Math.random() > 0.5;
            const targetSecond = Math.floor(Math.random() * 5) + 3; // 3 to 7 seconds out
            let countdown = targetSecond;

            if (isEven) {
                predictionEl.innerText = "ENTER EVEN";
                predictionEl.className = "signal-action even";
            } else {
                predictionEl.innerText = "ENTER ODD";
                predictionEl.className = "signal-action odd";
            }

            timingEl.innerText = `Confidence: 94% | Execute in ${countdown}s`;

            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                countdown--;
                if(countdown > 0) {
                    timingEl.innerText = `Confidence: 94% | Execute in ${countdown}s`;
                } else {
                    timingEl.innerText = `EXECUTING TRADE NOW...`;
                    clearInterval(countdownInterval);
                    // Cycle next signal after brief pause
                    setTimeout(simulateAISignal, 2000);
                }
            }, 1000);
        }

        function toggleEngine() {
            const btn = document.getElementById('btn-run');
            
            if (isRunning) {
                isRunning = false;
                btn.innerText = "Initialize Automated Bot";
                btn.classList.remove('running');
                clearInterval(countdownInterval);
                document.getElementById('ai-prediction').innerText = "SYSTEM PAUSED";
                document.getElementById('ai-prediction').className = "signal-action";
                document.getElementById('ai-timing').innerText = "Awaiting manual initialization";
            } else {
                isRunning = true;
                btn.innerText = "Halt Active Trading";
                btn.classList.add('running');
                simulateAISignal();
            }
        }
    </script>
</body>
</html>
