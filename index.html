<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Enterprise OS</title>
    <style>
        :root {
            var(--bg-outer): #e3e6e8;
            --bg-app: #f7f9fa;
            --surface-white: #ffffff;
            --primary-blue: #007aff;
            --primary-hover: #005bb5;
            --text-main: #111111;
            --text-muted: #6e7781;
            --border-color: #e1e4e8;
            --success-green: #28a745;
            --danger-red: #dc3545;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-lg: 0 16px 40px rgba(0,0,0,0.08);
            --shadow-blue: 0 8px 24px rgba(0, 122, 255, 0.25);
            --radius-xl: 32px;
            --radius-lg: 20px;
            --radius-md: 12px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e3e6e8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: var(--text-main);
        }

        /* Device Hardware Frame */
        .device-frame {
            width: 100%;
            max-width: 414px;
            height: 850px;
            max-height: 95vh;
            background-color: var(--bg-app);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg), inset 0 0 0 8px #fff;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* --- MAIN APP UI --- */
        .app-header {
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            padding: 24px 20px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .brand-title { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
        .brand-logo { width: 24px; height: 24px; background: var(--primary-blue); color: white; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
        
        .account-selector { background-color: #e8f0fe; color: var(--primary-blue); padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; border: none; outline: none; cursor: pointer; appearance: none; text-align: center; }

        .view-container { flex: 1; overflow-y: auto; position: relative; padding-bottom: 20px; }
        .view { display: none; flex-direction: column; padding: 20px; gap: 20px; animation: fadeIn 0.3s ease; }
        .view.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Balance & Funding Section */
        .equity-card { background-color: var(--surface-white); border-radius: var(--radius-lg); padding: 24px 20px; box-shadow: var(--shadow-sm); text-align: center; border: 1px solid var(--border-color); }
        .equity-label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .equity-amount { font-size: 3rem; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 16px; font-variant-numeric: tabular-nums; }
        .progress-container { background-color: #e3e6e8; border-radius: 10px; height: 8px; width: 100%; overflow: hidden; margin-bottom: 8px; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary-blue), #00c6ff); width: 0.1%; transition: width 0.5s ease; }
        .target-text { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; margin-bottom: 16px; }
        
        .funding-row { display: flex; gap: 10px; margin-top: 10px; }
        .btn-fund { flex: 1; padding: 12px; border-radius: var(--radius-md); font-weight: 700; font-size: 0.9rem; cursor: pointer; border: none; transition: var(--transition); }
        .btn-fund.deposit { background-color: rgba(40, 167, 69, 0.1); color: var(--success-green); }
        .btn-fund.deposit:active { background-color: rgba(40, 167, 69, 0.2); }
        .btn-fund.withdraw { background-color: rgba(220, 53, 69, 0.1); color: var(--danger-red); }
        .btn-fund.withdraw:active { background-color: rgba(220, 53, 69, 0.2); }

        /* AI Scanner */
        .ai-engine-box { background: var(--surface-white); border-radius: var(--radius-lg); border: 1px solid var(--primary-blue); padding: 24px; box-shadow: var(--shadow-blue); position: relative; overflow: hidden; }
        .ai-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .live-indicator { display: flex; align-items: center; gap: 8px; color: var(--primary-blue); }
        .radar-dot { width: 8px; height: 8px; background-color: var(--primary-blue); border-radius: 50%; animation: radar 1.5s infinite; }
        
        @keyframes radar { 0% { box-shadow: 0 0 0 0 rgba(0, 122, 255, 0.4); } 70% { box-shadow: 0 0 0 12px rgba(0, 122, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 122, 255, 0); } }

        .signal-screen { background-color: #0b101e; border-radius: var(--radius-md); padding: 20px; text-align: center; margin-bottom: 20px; color: white; min-height: 120px; display: flex; flex-direction: column; justify-content: center; }
        .signal-asset { font-size: 0.85rem; color: var(--primary-blue); font-weight: 700; margin-bottom: 8px; text-transform: uppercase; }
        .signal-text { font-size: 1.5rem; font-weight: 800; letter-spacing: 1px; margin-bottom: 8px; color: var(--success-green); }
        .signal-sub { font-size: 0.75rem; color: #8b95a5; font-weight: 600; }

        .parameters-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .param-input { background-color: var(--bg-app); border: 1px solid var(--border-color); padding: 10px 14px; border-radius: 8px; }
        .param-label { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; display: block; margin-bottom: 4px; }
        .param-input input, .param-input select { width: 100%; border: none; background: transparent; font-size: 1rem; font-weight: 800; color: var(--text-main); outline: none; }

        .btn-master { width: 100%; background-color: var(--primary-blue); color: white; border: none; padding: 18px; border-radius: var(--radius-lg); font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: var(--transition); box-shadow: var(--shadow-blue); }
        .btn-master:active { transform: scale(0.98); }
        .btn-master.active { background-color: var(--danger-red); box-shadow: 0 8px 24px rgba(220, 53, 69, 0.3); }

        /* Ledger */
        .ledger-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .total-pnl { font-size: 1rem; font-weight: 800; }
        .pnl-pos { color: var(--success-green); }
        .pnl-neg { color: var(--danger-red); }
        .delete-all { font-size: 0.8rem; color: var(--danger-red); cursor: pointer; font-weight: 700; }

        .ledger-row { background-color: var(--surface-white); border: 1px solid var(--border-color); padding: 16px; border-radius: var(--radius-md); display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; box-shadow: var(--shadow-sm); }
        .ledger-details { display: flex; flex-direction: column; gap: 4px; }
        .ledger-asset { font-weight: 700; font-size: 0.9rem; }
        .ledger-type { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
        .ledger-profit { font-weight: 800; color: var(--success-green); font-size: 1.1rem; }

        /* Navigation Bar */
        .bottom-nav { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-top: 1px solid var(--border-color); padding: 16px 20px 24px; display: flex; justify-content: space-around; z-index: 10; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); cursor: pointer; transition: var(--transition); }
        .nav-item.active { color: var(--primary-blue); }
        .nav-icon { font-size: 1.4rem; }
        .nav-label { font-size: 0.7rem; font-weight: 700; }
    </style>
</head>
<body>

    <div class="device-frame">
        
        <header class="app-header">
            <div class="brand-title">
                <div class="brand-logo">A</div>
                ApexOS
            </div>
            <select class="account-selector" id="account-type" onchange="switchAccountType()">
                <option value="real">Real Account</option>
                <option value="demo">Demo Account</option>
            </select>
        </header>

        <div class="view-container">
            
            <div id="view-home" class="view active">
                <div class="equity-card">
                    <div class="equity-label">Total Equity Balance</div>
                    <div class="equity-amount" id="display-balance">$50.00</div>
                    <div class="progress-container">
                        <div class="progress-bar" id="goal-progress"></div>
                    </div>
                    <div class="target-text">Goal Progress: <span id="target-display">$50,000.00 Target</span></div>
                    
                    <div class="funding-row">
                        <button class="btn-fund deposit" onclick="handleFunding('deposit')">↓ Deposit</button>
                        <button class="btn-fund withdraw" onclick="handleFunding('withdraw')">↑ Withdraw</button>
                    </div>
                </div>

                <div class="ai-engine-box">
                    <div class="ai-header">
                        <span>Neural Match Scanner</span>
                        <div class="live-indicator">
                            <div class="radar-dot"></div>
                            Monitoring Feed
                        </div>
                    </div>

                    <div class="signal-screen">
                        <div class="signal-asset" id="sig-asset">READY TO SYNC...</div>
                        <div class="signal-text" id="sig-main">--</div>
                        <div class="signal-sub" id="sig-status">Awaiting trade parameters</div>
                    </div>

                    <div class="parameters-row">
                        <div class="param-input">
                            <span class="param-label">Market Strategy</span>
                            <select id="inp-market" onchange="checkDigitDisplay()">
                                <option value="Matches/Differs">Matches/Differs</option>
                                <option value="Even/Odd">Even/Odd</option>
                                <option value="Over/Under">Over/Under Digits</option>
                            </select>
                        </div>
                        <div class="param-input" id="digit-selector-box" style="display:none;">
                            <span class="param-label">Prediction Digit</span>
                            <select id="inp-digit">
                                <option value="0">0</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5" selected>5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                            </select>
                        </div>
                        <div class="param-input">
                            <span class="param-label">Base Stake ($)</span>
                            <input type="number" id="inp-stake" value="1.00" step="1">
                        </div>
                    </div>

                    <button class="btn-master" id="btn-toggle-bot" onclick="toggleBotEngine()">Execute AI Automation</button>
                </div>
            </div>

            <div id="view-ledger" class="view">
                <div class="ledger-header">
                    <h3 style="font-size:1.1rem; font-weight:800;">Live Ledger</h3>
                    <div style="display:flex; gap: 15px; align-items:center;">
                        <span class="total-pnl" id="total-pnl">P&L: $0.00</span>
                        <span class="delete-all" onclick="clearLedger()">Clear All</span>
                    </div>
                </div>
                <div id="ledger-list">
                    <div style="text-align:center; padding: 40px 0; color:var(--text-muted); font-weight:600; font-size:0.85rem;">No executions recorded yet.</div>
                </div>
            </div>

        </div>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('view-home', this)">
                <span class="nav-icon">⎈</span>
                <span class="nav-label">Engine</span>
            </div>
            <div class="nav-item" onclick="switchTab('view-ledger', this)">
                <span class="nav-icon">≡</span>
                <span class="nav-label">Ledger</span>
            </div>
        </nav>
    </div>

    <script>
        let realBalance = 50.00;
        let demoBalance = 10000.00;
        let isRealAccount = true;
        const targetBalance = 50000.00;
        let totalPnL = 0;
        
        let isEngineRunning = false;
        let scanInterval;

        // Shift Toggles
        let currentShiftMatch = true; 
        let currentShiftEven = true;
        let currentShiftOver = true;

        const volatilityIndices = [
            "Volatility 10 (1s) Index", "Volatility 25 (1s) Index", "Volatility 50 (1s) Index", 
            "Volatility 75 (1s) Index", "Volatility 100 (1s) Index"
        ];

        window.onload = () => {
            updateBalanceUI();
        };

        function switchAccountType() {
            isRealAccount = (document.getElementById('account-type').value === 'real');
            updateBalanceUI();
        }

        function switchTab(viewId, element) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            element.classList.add('active');
        }

        function checkDigitDisplay() {
            const market = document.getElementById('inp-market').value;
            document.getElementById('digit-selector-box').style.display = market === 'Over/Under' ? 'block' : 'none';
        }

        // --- DEPOSIT / WITHDRAW LOGIC ---
        function handleFunding(action) {
            const amountStr = prompt(`Enter amount to ${action} ($):`);
            if(!amountStr) return;
            
            const amount = parseFloat(amountStr);
            if(isNaN(amount) || amount <= 0) {
                alert("Please enter a valid positive number.");
                return;
            }

            if(action === 'withdraw') {
                const currentBal = isRealAccount ? realBalance : demoBalance;
                if(amount > currentBal) {
                    alert("Insufficient funds for withdrawal.");
                    return;
                }
                if(isRealAccount) realBalance -= amount; else demoBalance -= amount;
            } else {
                if(isRealAccount) realBalance += amount; else demoBalance += amount;
            }
            updateBalanceUI();
        }

        function updateBalanceUI() {
            let bal = isRealAccount ? realBalance : demoBalance;
            document.getElementById('display-balance').innerText = `$${bal.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            let progress = (bal / targetBalance) * 100;
            document.getElementById('goal-progress').style.width = `${Math.min(progress, 100)}%`;
        }

        function updatePnL(val) {
            totalPnL += val;
            const pnlEl = document.getElementById('total-pnl');
            pnlEl.innerText = `P&L: $${totalPnL.toFixed(2)}`;
            pnlEl.className = `total-pnl ${totalPnL >= 0 ? 'pnl-pos' : 'pnl-neg'}`;
        }

        function clearLedger() {
            document.getElementById('ledger-list').innerHTML = '<div style="text-align:center; padding: 40px 0; color:var(--text-muted); font-weight:600; font-size:0.85rem;">No executions recorded yet.</div>';
            totalPnL = 0;
            updatePnL(0);
        }

        function toggleBotEngine() {
            const btn = document.getElementById('btn-toggle-bot');
            if (isEngineRunning) {
                isEngineRunning = false;
                btn.innerText = "Execute AI Automation";
                btn.classList.remove('active');
                clearTimeout(scanInterval);
            } else {
                isEngineRunning = true;
                btn.innerText = "Halt System Process";
                btn.classList.add('active');
                runScannerCycle();
            }
        }

        // --- TRADING ENGINE (95% WIN RATE + SHIFTING) ---
        function runScannerCycle() {
            if (!isEngineRunning) return;
            
            const market = document.getElementById('inp-market').value;
            const stake = parseFloat(document.getElementById('inp-stake').value) || 1.00;
            let targetDigit = parseInt(document.getElementById('inp-digit').value);
            if(isNaN(targetDigit)) targetDigit = 5;
            
            const currentAsset = volatilityIndices[Math.floor(Math.random() * volatilityIndices.length)];
            document.getElementById('sig-asset').innerText = `SCANNING: ${currentAsset}`;

            // 95% Win Rate Logic
            const isWin = Math.random() < 0.95; 
            
            let signalText = "";
            let signalSub = "";
            let profit = 0;
            let finalDigit = 0;

            if(market === "Matches/Differs") {
                // Shift Market Strategy
                currentShiftMatch = !currentShiftMatch; 
                
                if (currentShiftMatch) {
                    // Prediciting MATCH
                    finalDigit = isWin ? targetDigit : ((targetDigit + 1) % 10);
                    profit = isWin ? (stake * 8.09) : (-stake);
                    signalText = `MATCH: ${targetDigit}`;
                    signalSub = `Payout: 9.09x | Result: ${finalDigit}`;
                } else {
                    // Predicting DIFFER
                    finalDigit = isWin ? ((targetDigit + 1) % 10) : targetDigit;
                    profit = isWin ? (stake * 0.09) : (-stake);
                    signalText = `DIFFER: ${targetDigit}`;
                    signalSub = `Payout: 1.09x | Result: ${finalDigit}`;
                }

            } else if(market === "Even/Odd") {
                // Shift Market Strategy
                currentShiftEven = !currentShiftEven;
                
                if(currentShiftEven) {
                    // Predicting EVEN
                    finalDigit = isWin ? 2 : 1; 
                    profit = isWin ? (stake * 0.95) : (-stake);
                    signalText = "PREDICT: EVEN";
                    signalSub = `Payout: 1.95x | Result: ${finalDigit}`;
                } else {
                    // Predicting ODD
                    finalDigit = isWin ? 1 : 2;
                    profit = isWin ? (stake * 0.95) : (-stake);
                    signalText = "PREDICT: ODD";
                    signalSub = `Payout: 1.95x | Result: ${finalDigit}`;
                }

            } else if(market === "Over/Under") {
                // Shift Market Strategy
                currentShiftOver = !currentShiftOver;
                
                if(currentShiftOver) {
                    // Predicting OVER
                    // Make sure targetDigit isn't 9, otherwise Over is impossible. Fallback to 8 if so.
                    let safeTarget = targetDigit >= 9 ? 8 : targetDigit;
                    finalDigit = isWin ? 9 : 0; 
                    let prob = (9 - safeTarget) / 10;
                    let mult = prob > 0 ? (1 / prob) * 0.95 : 0; 
                    profit = isWin ? (stake * (mult - 1)) : (-stake);
                    
                    signalText = `OVER: ${safeTarget}`;
                    signalSub = `Payout: ${mult.toFixed(2)}x | Result: ${finalDigit}`;
                } else {
                    // Predicting UNDER
                    // Make sure targetDigit isn't 0, otherwise Under is impossible. Fallback to 1 if so.
                    let safeTarget = targetDigit <= 0 ? 1 : targetDigit;
                    finalDigit = isWin ? 0 : 9;
                    let prob = safeTarget / 10;
                    let mult = prob > 0 ? (1 / prob) * 0.95 : 0;
                    profit = isWin ? (stake * (mult - 1)) : (-stake);
                    
                    signalText = `UNDER: ${safeTarget}`;
                    signalSub = `Payout: ${mult.toFixed(2)}x | Result: ${finalDigit}`;
                }
            }

            document.getElementById('sig-main').innerText = signalText;
            document.getElementById('sig-main').style.color = isWin ? "var(--success-green)" : "var(--danger-red)";
            document.getElementById('sig-status').innerText = signalSub;
            
            scanInterval = setTimeout(() => {
                if (!isEngineRunning) return;
                
                if(isRealAccount) realBalance += profit; else demoBalance += profit;
                updateBalanceUI();
                updatePnL(profit);
                logExecution(profit, market, signalText, finalDigit);
                
                runScannerCycle();
            }, 2500); 
        }

        function logExecution(profit, market, signal, resultDigit) {
            const ledger = document.getElementById('ledger-list');
            if (ledger.innerText.includes("No executions")) ledger.innerHTML = '';
            const row = document.createElement('div');
            row.className = 'ledger-row';
            row.innerHTML = `
                <div class="ledger-details">
                    <span class="ledger-asset">${signal}</span>
                    <span class="ledger-type">${market} | Result: ${resultDigit}</span>
                </div>
                <div style="display:flex; align-items:center;">
                    <span class="ledger-profit" style="color: ${profit >= 0 ? 'var(--success-green)' : 'var(--danger-red)'}">
                        ${profit >= 0 ? '+' : ''}$${profit.toFixed(2)}
                    </span>
                </div>
            `;
            ledger.insertBefore(row, ledger.firstChild);
        }
    </script>
</body>
</html>
