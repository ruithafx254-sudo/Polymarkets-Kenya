<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Apex Quantum Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

:root{
--bg:#eef3f8;
--card:#ffffff;
--primary:#0a84ff;
--primary-light:#5eb6ff;
--text:#0f172a;
--muted:#6b7280;
--success:#10b981;
--danger:#ef4444;
--border:#e5e7eb;
--shadow:0 15px 40px rgba(15,23,42,.08);
--radius:28px;
}

body{
background:linear-gradient(135deg,#edf2f7,#dfe8f3);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:var(--text);
}

.app{
width:100%;
max-width:430px;
height:95vh;
background:var(--card);
border-radius:40px;
overflow:hidden;
box-shadow:0 30px 80px rgba(0,0,0,.15);
display:flex;
flex-direction:column;
position:relative;
}

.auth-screen{
position:absolute;
inset:0;
background:linear-gradient(160deg,#07111d,#10233c 70%);
color:#fff;
z-index:999;
padding:28px;
display:flex;
flex-direction:column;
justify-content:center;
transition:.4s;
}

.auth-screen.hidden{
opacity:0;
pointer-events:none;
transform:scale(1.03);
}

.logo{
width:90px;
height:90px;
border-radius:30px;
background:linear-gradient(135deg,var(--primary),#6fc4ff);
display:flex;
align-items:center;
justify-content:center;
font-size:2.5rem;
font-weight:800;
margin-bottom:24px;
box-shadow:0 20px 40px rgba(10,132,255,.35);
}

.auth-title{
font-size:2rem;
font-weight:800;
margin-bottom:10px;
}

.auth-sub{
color:#9db2ca;
line-height:1.6;
margin-bottom:30px;
}

.auth-box{
background:rgba(255,255,255,.05);
padding:22px;
border-radius:28px;
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(12px);
}

.auth-box input{
width:100%;
padding:16px;
border:none;
outline:none;
border-radius:18px;
margin-bottom:14px;
background:rgba(255,255,255,.08);
color:#fff;
font-size:1rem;
}

.auth-box button{
width:100%;
padding:16px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,var(--primary),var(--primary-light));
color:#fff;
font-weight:800;
font-size:1rem;
cursor:pointer;
box-shadow:0 12px 30px rgba(10,132,255,.35);
}

.topbar{
padding:22px 20px 16px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid var(--border);
background:rgba(255,255,255,.88);
backdrop-filter:blur(10px);
}

.brand{
display:flex;
align-items:center;
gap:10px;
font-size:1.15rem;
font-weight:800;
}

.brand-icon{
width:36px;
height:36px;
border-radius:14px;
background:linear-gradient(135deg,var(--primary),#6fc4ff);
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-weight:800;
}

.account-pill{
padding:10px 14px;
background:#edf5ff;
color:var(--primary);
font-size:.82rem;
font-weight:700;
border-radius:999px;
}

.main{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:18px;
}

.balance-card{
background:linear-gradient(145deg,#ffffff,#f5f8fc);
padding:26px;
border-radius:32px;
box-shadow:var(--shadow);
position:relative;
overflow:hidden;
}

.balance-card::before{
content:'';
position:absolute;
right:-40px;
top:-40px;
width:180px;
height:180px;
border-radius:50%;
background:rgba(10,132,255,.08);
}

.balance-label{
font-size:.82rem;
font-weight:700;
color:var(--muted);
margin-bottom:8px;
}

.balance-amount{
font-size:3rem;
font-weight:800;
margin-bottom:16px;
}

.progress{
height:10px;
background:#e8edf4;
border-radius:999px;
overflow:hidden;
margin-bottom:10px;
}

.progress-bar{
height:100%;
width:0%;
background:linear-gradient(90deg,var(--primary),#66bfff);
}

.balance-bottom{
display:flex;
justify-content:space-between;
font-size:.8rem;
color:var(--muted);
font-weight:600;
}

.quick-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

.quick-btn{
background:#fff;
border:none;
padding:18px;
border-radius:24px;
box-shadow:var(--shadow);
text-align:left;
font-weight:700;
cursor:pointer;
}

.quick-btn span{
display:block;
margin-top:6px;
font-size:.75rem;
color:var(--muted);
}

.scanner{
background:#fff;
padding:22px;
border-radius:32px;
box-shadow:var(--shadow);
}

.scanner-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
}

.scanner-title{
font-size:1rem;
font-weight:800;
}

.live{
font-size:.8rem;
font-weight:700;
color:var(--success);
}

.signal-box{
background:#081321;
color:#fff;
padding:24px;
border-radius:24px;
text-align:center;
margin-bottom:18px;
}

.signal-market{
font-size:.8rem;
color:#66bfff;
margin-bottom:10px;
font-weight:700;
}

.signal-main{
font-size:2rem;
font-weight:800;
margin-bottom:10px;
}

.signal-sub{
font-size:.82rem;
color:#a5bdd6;
}

.grid-2{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-bottom:14px;
}

.input-box{
background:#f8fafc;
padding:14px;
border-radius:20px;
}

.input-box label{
display:block;
font-size:.72rem;
font-weight:700;
color:var(--muted);
margin-bottom:8px;
}

.input-box input,
.input-box select{
width:100%;
border:none;
outline:none;
background:transparent;
font-size:1rem;
font-weight:800;
}

.execute-btn{
width:100%;
padding:18px;
border:none;
border-radius:22px;
background:linear-gradient(135deg,var(--primary),#67beff);
color:#fff;
font-size:1rem;
font-weight:800;
cursor:pointer;
box-shadow:0 15px 30px rgba(10,132,255,.3);
}

.execute-btn.active{
background:linear-gradient(135deg,var(--danger),#ff7b7b);
}

.bottom-nav{
display:flex;
justify-content:space-around;
padding:18px 20px 24px;
border-top:1px solid var(--border);
background:#fff;
}

.nav-item{
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
font-size:.75rem;
font-weight:700;
color:var(--muted);
cursor:pointer;
}

.nav-item.active{
color:var(--primary);
}

.toast-wrap{
position:absolute;
top:90px;
left:50%;
transform:translateX(-50%);
width:90%;
z-index:2000;
}

.toast{
background:#111827;
color:#fff;
padding:14px;
border-radius:16px;
margin-bottom:10px;
font-size:.9rem;
font-weight:600;
}

</style>
</head>
<body>

<div class="app">

<div class="auth-screen" id="auth-screen">
<div class="logo">A</div>
<div class="auth-title">Apex Quantum</div>
<div class="auth-sub">Professional AI-assisted market analysis dashboard with advanced risk management.</div>

<div class="auth-box">
<input type="text" placeholder="Full Name" id="name">
<input type="email" placeholder="Email Address" id="email">
<input type="password" placeholder="Password" id="password">
<button onclick="login()">Enter Dashboard</button>
</div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<div class="topbar">
<div class="brand">
<div class="brand-icon">A</div>
ApexOS
</div>
<div class="account-pill">REAL ACCOUNT</div>
</div>

<div class="main">

<div class="balance-card">
<div class="balance-label">TOTAL EQUITY</div>
<div class="balance-amount" id="balance">$50.00</div>
<div class="progress">
<div class="progress-bar" id="progress"></div>
</div>
<div class="balance-bottom">
<span>Target Progress</span>
<span>$50,000 Goal</span>
</div>
</div>

<div class="quick-grid">
<button class="quick-btn">
Deposit Funds
<span>Instant wallet funding</span>
</button>

<button class="quick-btn">
Withdraw
<span>Fast account settlement</span>
</button>
</div>

<div class="scanner">
<div class="scanner-top">
<div class="scanner-title">AI Market Scanner</div>
<div class="live">● LIVE</div>
</div>

<div class="signal-box">
<div class="signal-market" id="asset">Awaiting market scan...</div>
<div class="signal-main" id="signal">--</div>
<div class="signal-sub" id="status">Configure your strategy parameters below.</div>
</div>

<div class="grid-2">
<div class="input-box">
<label>Market Type</label>
<select id="market">
<option>Matches/Differs</option>
<option>Even/Odd</option>
<option>Over/Under</option>
</select>
</div>

<div class="input-box">
<label>Stake ($)</label>
<input type="number" id="stake" value="1">
</div>
</div>

<div class="grid-2">
<div class="input-box">
<label>Take Profit ($)</label>
<input type="number" id="tp" value="25">
</div>

<div class="input-box">
<label>Stop Loss ($)</label>
<input type="number" id="sl" value="10">
</div>
</div>

<button class="execute-btn" id="bot-btn" onclick="toggleBot()">
Start AI Scanner
</button>
</div>

</div>

<div class="bottom-nav">
<div class="nav-item active">
<div>⌂</div>
<div>Home</div>
</div>

<div class="nav-item">
<div>≡</div>
<div>Ledger</div>
</div>

<div class="nav-item">
<div>👤</div>
<div>Profile</div>
</div>
</div>

</div>

<script>
let balance = 50;
let botRunning = false;
let loop;

const assets = [
'Volatility 10 Index',
'Volatility 25 Index',
'Volatility 50 Index',
'Volatility 75 Index',
'Volatility 100 Index'
];

function toast(message){
const wrap = document.getElementById('toast-wrap');
const div = document.createElement('div');
div.className='toast';
div.innerText=message;
wrap.appendChild(div);
setTimeout(()=>div.remove(),3000);
}

function login(){
const name = document.getElementById('name').value;
const email = document.getElementById('email').value;
const password = document.getElementById('password').value;

if(!name || !email || !password){
toast('Please complete all fields');
return;
}

localStorage.setItem('apexUser',JSON.stringify({name,email,password}));
document.getElementById('auth-screen').classList.add('hidden');
toast('Welcome back '+name);
updateUI();
}

function updateUI(){
document.getElementById('balance').innerText='$'+balance.toFixed(2);
document.getElementById('progress').style.width=Math.min((balance/50000)*100,100)+'%';
}

function toggleBot(){
const btn = document.getElementById('bot-btn');

if(botRunning){
botRunning=false;
btn.innerText='Start AI Scanner';
btn.classList.remove('active');
clearTimeout(loop);
return;
}

botRunning=true;
btn.innerText='Stop AI Scanner';
btn.classList.add('active');
runBot();
}

function runBot(){
if(!botRunning) return;

const market = document.getElementById('market').value;
const stake = parseFloat(document.getElementById('stake').value) || 1;
const tp = parseFloat(document.getElementById('tp').value) || 25;
const sl = parseFloat(document.getElementById('sl').value) || 10;

const asset = assets[Math.floor(Math.random()*assets.length)];

let signal='';
let payout='';

if(market==='Matches/Differs'){
const digit=Math.floor(Math.random()*10);
signal='DIFFER '+digit;
payout='Variable payout based on market conditions';
}
else if(market==='Even/Odd'){
signal=Math.random()>0.5?'EVEN':'ODD';
payout='Estimated payout displayed dynamically';
}
else{
const digit=Math.floor(Math.random()*9);
signal='OVER '+digit;
payout='Estimated payout displayed dynamically';
}

const simulatedWin = Math.random() < 0.55;
const pnl = simulatedWin ? (stake*0.9) : (-stake);

balance += pnl;

if(balance <= sl){
botRunning=false;
document.getElementById('bot-btn').innerText='Start AI Scanner';
document.getElementById('bot-btn').classList.remove('active');
toast('Stop loss reached');
return;
}

if(balance >= tp + 50){
botRunning=false;
document.getElementById('bot-btn').innerText='Start AI Scanner';
document.getElementById('bot-btn').classList.remove('active');
toast('Take profit reached');
return;
}

updateUI();

document.getElementById('asset').innerText=asset;
document.getElementById('signal').innerText=signal;
document.getElementById('status').innerText=payout;

loop=setTimeout(runBot,3000);
}

window.onload=()=>{
const saved = JSON.parse(localStorage.getItem('apexUser'));

if(saved){
document.getElementById('auth-screen').classList.add('hidden');
}

updateUI();
}
</script>

</body>
</html>
